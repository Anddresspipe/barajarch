name: CI
on:
  push: { branches: [main] }
  pull_request:

permissions:
  contents: read

jobs:
  calidad-y-arquitectura:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: cartas, POSTGRES_DB: cartas }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:cartas@localhost:5432/cartas
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: backend/package-lock.json }
      - run: npm ci
      - name: Migrar esquema
        run: for f in db/migrations/*.sql; do psql "$DATABASE_URL" -f "$f"; done
      - name: Lint (CC<=10, sin literales de modalidad, pg solo en repositorios)
        run: npm run lint
      - name: Compilar
        run: npm run build
      - name: Pruebas unitarias y de dominio
        run: npx jest tests/motor-reglas tests/partidas tests/lobby
      - name: Fitness functions (arquitectura)
        run: npm run test:arch
      - name: Metricas (falla si CC > 10)
        run: npm run metricas
      - name: Simulacion E2E Clasica + Apuntado
        run: npm run simular
      - uses: actions/upload-artifact@v4
        with: { name: metricas, path: docs/metricas.json }
